<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instituto Panamericano - Acceso Docentes</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #1c2333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .subtitle {
      margin: 8px 0 24px 0;
      font-size: 0.85rem;
      color: #666666;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #4a5568;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #3b82f6;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #2563eb;
    }

    .btn-submit:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 15px;
      font-size: 0.85rem;
      min-height: 1.2em;
    }

    .msg-error {
      color: #e53e3e;
    }

    .msg-success {
      color: #38a169;
    }

    .msg-info {
      color: #d97706;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="title">Instituto Panamericano</h2>
    <p class="subtitle">Acceso exclusivo para Docentes</p>
    
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username">
    </div>
    
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    
    <button type="button" class="btn-submit" id="btnIngresar" onclick="login()">Ingresar al Formulario</button>
    
    <div id="msg"></div>
  </div>

  <script>
    // URL de tu Web App de Google Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzL2gh4Hsk8edcMMuB8WfsVhPiAU1LGGUIChrWeXQIVUAdILx1B9zfozmDLXylqzgpD4g/exec";

    async function login() {
      const usuarioInput = document.getElementById('usuario');
      const passwordInput = document.getElementById('password');
      const btn = document.getElementById('btnIngresar');
      const msg = document.getElementById('msg');

      const u = usuarioInput.value.trim();
      const p = passwordInput.value.trim();

      if (!u || !p) {
        msg.className = "msg-error";
        msg.innerText = "Por favor completa todos los campos.";
        return;
      }

      // Bloquear botón mientras valida
      btn.disabled = true;
      msg.className = "msg-info";
      msg.innerText = "Validando credenciales...";

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8" // Evita la restricción CORS de Google
          },
          body: JSON.stringify({ usuario: u, password: p })
        });

        const data = await response.json();

      if (data.success) {
  msg.className = "msg-success";
  msg.innerText = "¡Acceso concedido!";
  
  // Reemplaza todo el contenido del sitio por el sistema cargado
  setTimeout(() => {
    document.body.innerHTML = `
      <iframe 
        src="https://script.google.com/macros/s/TU_SCRIPT_ID/exec" 
        style="width:100vw; height:100vh; border:none; margin:0; padding:0;"
        allow="fullscreen">
      </iframe>
    `;
  }, 800);
}
    }
  </script>

</body>
</html>
